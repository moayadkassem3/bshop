plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.salonrandevu'
version = '1.0.0'

android {
  namespace "com.salonrandevu.push"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core:1.13.1"
  // Push messages; the app's google-services.json (app.json android.googleServicesFile) configures it.
  implementation "com.google.firebase:firebase-messaging:24.1.0"
}
