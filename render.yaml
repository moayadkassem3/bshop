# Test deployment (Render Blueprint): one free web service running the website
# and backend together, and a free PostgreSQL database, in Frankfurt.
# DEMO_MODE shows sign-in codes on screen (no SMS provider yet) and approves new
# salons immediately. Do not use it for real customers.
services:
  - type: web
    name: salon-randevu-test
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/handoff-review-y35py7
    buildCommand: npm ci --include=dev && npm run build --workspace apps/web
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/public/plans
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: salon-randevu-test-db
          property: connectionString
      - key: OTP_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: PHOTO_STORAGE
        value: database
      - key: TICK_SECONDS
        value: "5"

databases:
  - name: salon-randevu-test-db
    plan: free
    region: frankfurt
    databaseName: bshop
    user: bshop
    postgresMajorVersion: "16"
